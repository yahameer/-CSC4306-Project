DoCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - NUK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <h2>NUK CLEARANCE</h2>
    <a href="index.html">Home</a>
</header>
<main class="register-section">
<div class="register-container">
  
  <h1>Student Registration</h1>
  <p class="subtitle">Create your clearance account</p>
  
  <form id="registerForm">
    
    <div class="form-group">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
    </div>
    
    <div class="form-group">
      <label for="matric">Matriculation Number</label>
      <input type="text" id="matric" name="matric" placeholder="Enter matric number" required>
    </div>
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter email address" required>
    </div>
    
    <div class="form-group">
      <label for="department">Department</label>
      <input type="text" id="department" name="department" placeholder="Enter department" required>
    </div>
    
    <div class="form-group">
      <label for="level">Academic Level</label>
      <select id="level" name="level" required>
        <option value="">Select your level</option>
        <option value="100">100 Level</option>
        <option value="200">200 Level</option>
        <option value="300">300 Level</option>
        <option value="400">400 Level</option>
        <option value="500">500 Level</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create password" minlength="8" required>
    </div>
    
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
    </div>
    
    <button type="submit" class="register-btn">Create Account</button>
    
    <p id="registerMessage"></p>
    
  </form>
  
  <div class="login-link">
    Already have an account?
    <a href="login.html">Login here</a>
  </div>
  
</div>
</main>
<footer>
    <p>&copy; 2026 Student Clearance Management System</p>
    <p>Northwest University Kano</p>
</footer>
<script src="script.js"></script>
</body>

</html>
